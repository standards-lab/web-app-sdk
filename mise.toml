# The SDK's tools and tasks.
# See docs/development.md
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.24.1", version_prefix = "marathon/v" }
actionlint = "1.7.12"
node = "26.13.1"
pnpm = "12.23.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }
nats-server = "2.15.3"
go = "1.27.4"

[tools."http:chrome-headless-shell"]
version = "158.0.8127.88"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:63401333cc587645bfaeea7f0c90958b327d249251e23954a47f30112ca23d5b", size = "132091593" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, shellcheck, actionlint, lint-context, and lint-references"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows", "lint:context"]

[tasks."lint:eslint"]
description = "Lint with ESLint, the layer's imports included"
depends = ["preflight"]
run = "pnpm exec eslint ."

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts"
run = "shellcheck scripts/*.sh"

[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint, which shellchecks each run: block with the pinned shellcheck"
run = "actionlint"

[tasks."lint:context"]
description = "Lint the context and every reference with marathon's lint-context and lint-references"
run = "scripts/lint-marathon.sh"

[tasks.types]
description = "Type-check the sources and the tests with tsc"
depends = ["types:src", "types:test"]

[tasks."types:src"]
description = "Type-check the sources with tsc"
depends = ["preflight"]
run = "tsc --noEmit -p ."

[tasks."types:test"]
description = "Type-check the tests with tsc, over the build"
depends = ["build"]
run = "tsc -p tsconfig.test.json"

[tasks.build]
description = "Build src/ into dist/: tsc's emit, with any handwritten .d.ts beside it"
depends = ["preflight"]
run = "scripts/build.sh"

[tasks."test:unit"]
description = "Run the unit tier on the build, the lint, a pack of the build, and the NATS adapter in the pinned nats-server"
depends = ["preflight nats", "build"]
run = "NATS_SERVER=$(mise which nats-server) node --test 'test/unit/*.test.ts'"

[tasks."test:browser"]
description = "Run the browser tier on dist/ in the pinned chrome-headless-shell, the uploader against test/server's Go module built with the pinned go"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"

[tasks.check]
description = "Run every check: the linters, lint-context and lint-references among them, types, build, and the unit and browser tiers; reads no network; writes dist/"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

[tasks.install]
description = "Install the pins, node_modules, and test/server's Go module; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile", "go -C test/server mod download"]

[tasks.currency]
description = "Report every mise tool, package.json pin, action pin, the tooling's tag, the NATS peers' ranges, test/server's requirements and go directive, and the upload draft revision behind its latest, exiting nonzero if any; reads the network"
run = "scripts/currency.sh"
quiet = true
